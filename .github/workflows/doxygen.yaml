name: Publish Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config doxygen graphviz

      - name: Generate documentation
        run: |
          ./autogen.sh
          ./configure --enable-tests=no
          make doxygen

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: doxygen/html

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    # Pages must be enabled once by the repository owner (Settings, Pages, Source: GitHub Actions);
    # until then this job reports an error without failing the workflow's build.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
