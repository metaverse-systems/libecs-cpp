name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      repeat:
        description: "Run make check this many times in a row (reliability check)"
        default: "1"

# The only grant; no job raises it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: plain, sanitizer: "" }
          - { name: address+undefined, sanitizer: address }
          - { name: thread, sanitizer: thread }
          - { name: plain (arm64), sanitizer: "", runner: ubuntu-24.04-arm }

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config catch2

      - name: Lower address randomisation for the sanitizer runtime
        if: matrix.sanitizer != ''
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          ./autogen.sh
          ./configure ${SANITIZER:+--enable-sanitizer=$SANITIZER}

      - name: Check the build uses no processor-specific flags
        run: |
          if grep -nE -- '-m(avx|sse|ssse3|fma|bmi)|-march=|-mtune=native' src/Makefile tests/Makefile; then
            echo "::error::processor-specific compiler flags found in the generated Makefiles"
            exit 1
          fi

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        env:
          REPEAT: ${{ inputs.repeat || 1 }}
        run: |
          case "$REPEAT" in
            ''|*[!0-9]*|0)
              echo "repeat must be a positive integer, got '$REPEAT'" >&2
              exit 2
              ;;
          esac
          i=1
          while [ "$i" -le "$REPEAT" ]; do
            echo "make check run $i of $REPEAT"
            make check -j"$(nproc)" VERBOSE=1 || exit $?
            i=$((i + 1))
          done

      - name: Check the sanitizer runtime is linked
        if: matrix.sanitizer != ''
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          case "$SANITIZER" in
            address) runtime=libasan ;;
            thread) runtime=libtsan ;;
          esac
          if ! ldd tests/.libs/test_Container | grep -q "$runtime"; then
            echo "::error::tests/.libs/test_Container is not linked with $runtime"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### test (${{ matrix.name }})"
            if [ -f tests/test-suite.log ]; then
              grep -E '^# (TOTAL|PASS|SKIP|XFAIL|FAIL|XPASS|ERROR):' tests/test-suite.log || true
            else
              echo "No test-suite.log found: the build failed before the tests ran."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f tests/test-suite.log ]; then
            grep -E '^(FAIL|ERROR): [^ ]+$' tests/test-suite.log | sort -u | while read -r line; do
              echo "::error::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          for f in tests/*.log; do
            [ -f "$f" ] || continue
            grep '^MALFORMED KNOWN GAP:' "$f" | while read -r line; do
              echo "::error::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
            grep '^KNOWN GAP:' "$f" | while read -r line; do
              echo "::notice::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
            grep '^STALE KNOWN GAP:' "$f" | while read -r line; do
              echo "::warning::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          exit 0

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.name }}
          path: |
            tests/*.log
            tests/test-suite.log
          if-no-files-found: ignore
